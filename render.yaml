services:
  - type: web
    name: cafeloop
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      # External database (Neon/Supabase Postgres) so cafe data survives
      # redeploys and restarts:
      - key: DATABASE_URL
        sync: false
      # Hidden /control panel secret (owner activates subscriptions from it):
      - key: ADMIN_SECRET
        sync: false
      # Optional: email sending for verification / password-reset codes.
      # Until these are set, codes are printed to the server logs instead.
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
